<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" role="img" aria-labelledby="title">
  <title id="title">Aurora Wireless Earbuds</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ede9fe"/>
      <stop offset="1" stop-color="#c4b5fd"/>
    </linearGradient>
    <linearGradient id="case" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e1b4b"/>
      <stop offset="1" stop-color="#312e81"/>
    </linearGradient>
    <linearGradient id="bud" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#6d28d9"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="480" height="360" fill="url(#bg)"/>
  <ellipse cx="240" cy="300" rx="150" ry="18" fill="#4c1d95" opacity="0.18"/>

  <!-- Charging case: a rounded pebble, open lid -->
  <path d="M120 190 Q120 150 160 150 H320 Q360 150 360 190 V230 Q360 290 300 292 H180 Q120 290 120 230 Z" fill="url(#case)"/>
  <path d="M128 150 Q132 100 180 96 H300 Q348 100 352 150 Z" fill="#3730a3"/>
  <rect x="120" y="148" width="240" height="6" rx="3" fill="#a5b4fc" opacity="0.6"/>
  <circle cx="240" cy="262" r="5" fill="#34d399"/>
  <circle cx="240" cy="262" r="12" fill="url(#glow)" opacity="0.5"/>

  <!-- Left earbud: round body with short stem -->
  <g transform="translate(178 112) rotate(-18)">
    <circle r="34" fill="url(#bud)"/>
    <circle r="16" fill="#ede9fe" opacity="0.85"/>
    <rect x="-9" y="26" width="18" height="44" rx="9" fill="#7c3aed"/>
  </g>

  <!-- Right earbud -->
  <g transform="translate(302 112) rotate(18)">
    <circle r="34" fill="url(#bud)"/>
    <circle r="16" fill="#ede9fe" opacity="0.85"/>
    <rect x="-9" y="26" width="18" height="44" rx="9" fill="#7c3aed"/>
  </g>

  <!-- Sparkles -->
  <path d="M88 84 l5 12 12 5 -12 5 -5 12 -5 -12 -12 -5 12 -5z" fill="#ffffff" opacity="0.8"/>
  <path d="M398 70 l3 8 8 3 -8 3 -3 8 -3 -8 -8 -3 8 -3z" fill="#ffffff" opacity="0.7"/>
</svg>
