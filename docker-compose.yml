version: '3.8'

# Local stand-ins for the cloud services in the architecture:
#   postgres -> RDS / Aurora, redis -> ElastiCache, sqs (ElasticMQ) -> Amazon SQS,
#   web (nginx) -> CloudFront + S3 for the app and an ALB in front of the API.
#
#   pnpm infra:up    postgres, redis, sqs only (run the apps on the host with pnpm dev:*)
#   pnpm stack:up    everything: 2 API instances behind nginx + 2 workers, on :8080

x-backend: &backend
  build:
    context: .
    dockerfile: apps/backend/Dockerfile
  image: flash-sale-demo-backend
  restart: unless-stopped
  environment: &backend-env
    NODE_ENV: production
    LOG_LEVEL: info
    DATABASE_URL: postgres://flashsale:flashsale@postgres:5432/flashsale
    REDIS_URL: redis://redis:6379
    AWS_REGION: us-east-1
    AWS_ACCESS_KEY_ID: local
    AWS_SECRET_ACCESS_KEY: local
    SQS_ENDPOINT: http://sqs:9324
    PURCHASE_REQUESTS_QUEUE_URL: http://sqs:9324/000000000000/purchase-requests
    PURCHASE_RESULTS_QUEUE_URL: http://sqs:9324/000000000000/purchase-results
  depends_on:
    migrate:
      condition: service_completed_successfully
    redis:
      condition: service_healthy
    sqs:
      condition: service_started

x-api: &api
  <<: *backend
  environment:
    <<: *backend-env
    DATABASE_POOL_SIZE: 10 # the API rarely queries Postgres (cached sale, status fallback)
  healthcheck:
    test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:3000/api/health/ready || exit 1']
    interval: 5s
    timeout: 3s
    retries: 10

x-worker: &worker
  <<: *backend
  command: ['node', 'dist/main.worker.js']
  environment:
    <<: *backend-env
    DATABASE_POOL_SIZE: 20
    WORKER_POLLERS: 2 # 2 pollers × 10 messages = 20 in flight, one per DB connection

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: flashsale
      POSTGRES_PASSWORD: flashsale
      POSTGRES_DB: flashsale
    ports:
      - '5433:5432' # 5433 on the host to avoid clashing with a local Postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U flashsale -d flashsale']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7.4-alpine
    # AOF persistence so dedupe keys and status cache survive a restart.
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  sqs:
    image: softwaremill/elasticmq-native:1.6.11
    ports:
      - '9324:9324' # SQS API
      - '9325:9325' # Web UI with queue stats
    volumes:
      - ./infrastructure/docker/elasticmq.conf:/opt/elasticmq.conf:ro

  migrate:
    <<: *backend
    command: ['node', 'dist/main.migrate.js']
    restart: 'no'
    depends_on:
      postgres:
        condition: service_healthy

  api-1: *api
  api-2: *api

  worker-1: *worker
  worker-2: *worker

  web:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    image: flash-sale-demo-web
    restart: unless-stopped
    environment:
      # Load shedding budget for the whole API, from the stress tests on a laptop with 2 API
      # instances (≈ 2,000 req/s capacity, minus headroom). Retune per deployment; set a very
      # high value (e.g. API_RATE_LIMIT=100000 pnpm stack:up) to measure raw capacity.
      API_RATE_LIMIT: ${API_RATE_LIMIT:-1500}
      API_RATE_BURST: ${API_RATE_BURST:-500}
    ports:
      - '8080:80'
    depends_on:
      api-1:
        condition: service_healthy
      api-2:
        condition: service_healthy

volumes:
  postgres-data:
  redis-data:
