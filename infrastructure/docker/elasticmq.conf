include classpath("application.conf")

# "*" makes queue URLs use the request's Host header, so the same queues are
# reachable as localhost:9324 from the host and sqs:9324 from other containers.
node-address {
  protocol = http
  host = "*"
  port = 9324
  context-path = ""
}

rest-sqs {
  enabled = true
  bind-port = 9324
  bind-hostname = "0.0.0.0"
  sqs-limits = strict
}

rest-stats {
  enabled = true
  bind-port = 9325
  bind-hostname = "0.0.0.0"
}

queues {
  # Incoming purchase attempts, consumed by the worker.
  purchase-requests {
    defaultVisibilityTimeout = 30 seconds
    receiveMessageWait = 20 seconds
    deadLettersQueue {
      name = "purchase-requests-dlq"
      maxReceiveCount = 5
    }
  }
  purchase-requests-dlq {}

  # Final outcomes, consumed by the notification module.
  purchase-results {
    defaultVisibilityTimeout = 30 seconds
    receiveMessageWait = 20 seconds
    deadLettersQueue {
      name = "purchase-results-dlq"
      maxReceiveCount = 5
    }
  }
  purchase-results-dlq {}
}
